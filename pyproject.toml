[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mailmind"
description = "An MCP server and webapp that lets agents work with mailboxes without letting them change anything a person has not agreed to"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "imapclient>=3.0",
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jinja2>=3.1",
    "attrs>=24.1",
    "click>=8.1",
]

[project.scripts]
mailmindctl = "mailmind.cli:main"

[project.optional-dependencies]
# The desktop secret store, for `secret-storage://` password URLs. Optional because it
# needs a session bus to talk to and there is nothing to talk to on a headless box —
# see docs/configuration.md for what to use there instead.
secrets = [
    "keyring>=25",
]

# The test and dev sets are not extras: nobody installing mailmind from an index wants
# them, and `uv sync` only reaches for dependency groups. Keeping them here is what
# makes a bare `uv sync` leave you with a working checkout.
[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
dev = [
    {include-group = "test"},
    "mailmind[secrets]",
    "ruff>=0.6",
]
# Not in dev: building the site is a thing you do on purpose, and mkdocs-material pulls a
# tree of its own. `uv run --group docs mkdocs serve`.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/mailmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: runs against a real remote mailbox; skipped unless credentials are configured",
    "container: needs a containerised mail server",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 96
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Migration bodies are generated. Reformatting one by hand makes it harder to diff
# against what alembic would produce, which is the thing you actually want to check.
"src/mailmind/db/migrations/versions/*" = ["E501"]
